name: Weekly SharePoint to Google Drive Backup

on:
  push:
    branches:
      - main
  schedule:
    # Runs every Sunday at 03:00 HKT (Saturday 19:00 UTC) during off-peak hours
    - cron: '0 19 * * 6'
  workflow_dispatch: # Enables manual 1-click execution in GitHub Actions UI

concurrency:
  group: sharepoint-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Run SharePoint to GDrive Backup
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backup/requirements.txt'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backup/requirements.txt

      - name: Execute Backup Pipeline
        env:
          SP_SITE_URL: "https://k35n.sharepoint.com/sites/CHUNKING"
          SP_COOKIES_JSON: ${{ secrets.SP_COOKIES_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python backup/backup_sharepoint_to_gdrive.py

      - name: Upload Backup Execution Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-report
          path: backup/backup_report.json
          retention-days: 30

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error title=Backup Failed::The weekly SharePoint to Google Drive backup encountered an error or throttling circuit breaker trip. Check the backup-report artifact for details."
